<title>Designer Field Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=Architects+Daughter&display=swap">
<style>
/* Layout: a single centered column. A plan-view "site sheet" sits on top and gains one plant per answered step; the question card sits below it. */
:root {
  --paper: #f2f4ee;
  --sheet: #fbfcf8;
  --ink: #1d2a22;
  --muted: #5c6b61;
  --line: #cfd8cc;
  --moss: #46703a;
  --moss-soft: #dfe9d6;
  --marigold: #c98a1c;
  --leaf-a: #7fa866;
  --leaf-b: #a9c48a;
  --bloom: #d4789b;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Architects Daughter", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111713; --sheet: #18201b; --ink: #e3eadf; --muted: #9aab9e; --line: #2d3a31;
    --moss: #93c27a; --moss-soft: #24331f; --marigold: #e6ad4a; --leaf-a: #5f8a4c; --leaf-b: #3f5f35; --bloom: #c96b8e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111713; --sheet: #18201b; --ink: #e3eadf; --muted: #9aab9e; --line: #2d3a31;
  --moss: #93c27a; --moss-soft: #24331f; --marigold: #e6ad4a; --leaf-a: #5f8a4c; --leaf-b: #3f5f35; --bloom: #c96b8e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Site sheet */
.sheet {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px 8px;
}
.sheet-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-hand); color: var(--muted); font-size: 14px;
}
.sheet-head b { color: var(--ink); font-weight: 400; }
.sheet svg { display: block; width: 100%; height: auto; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--moss); transition: width .4s ease; }

.plant { transform-box: fill-box; transform-origin: center; animation: sprout .55s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes sprout { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .plant { animation: none; }
  .progress > i { transition: none; }
  .card { animation: none !important; }
}

/* Question card */
.card {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px 22px;
  display: flex; flex-direction: column; gap: 24px;
  animation: rise .35s ease both;
}
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
.eyebrow {
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--moss); font-weight: 600;
}
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(28px, 6vw, 40px); }
h2 { font-size: clamp(24px, 5vw, 30px); }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.head { display: flex; flex-direction: column; gap: 8px; }

.q { display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.q > legend, .q > label.qlabel { font-weight: 600; font-size: 16px; padding: 0; margin-bottom: 2px; }
.hint { color: var(--muted); font-size: 14px; font-weight: 400; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 8px 14px; border-radius: 999px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--moss); }
.chip[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: var(--sheet); }
.chip:disabled { opacity: .45; cursor: not-allowed; }

input[type="text"], textarea {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale .chip { border-radius: 6px; padding: 10px 4px; text-align: center; }
.scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; gap: 12px; }

.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.pick {
  font: inherit; text-align: left; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
}
.pick:hover { border-color: var(--moss); }
.pick b { font-weight: 600; font-size: 15px; }
.pick span { color: var(--muted); font-size: 13px; line-height: 1.35; }
.pick[aria-pressed="true"] { background: var(--moss-soft); border-color: var(--moss); }
.pick[aria-pressed="true"] b::before { content: "✓ "; color: var(--moss); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.count { font-family: var(--font-hand); color: var(--marigold); font-size: 15px; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 11px 20px;
  border: 1px solid var(--moss); background: var(--moss); color: var(--sheet);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.06); }
.kbd { color: var(--muted); font-size: 13px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }

.summary {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
  white-space: pre-wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px; max-height: 360px; overflow: auto; min-width: 0;
}
.status { font-family: var(--font-hand); color: var(--moss); font-size: 16px; min-height: 1.5em; }
.foot { color: var(--muted); font-size: 13px; text-align: center; }
</style>

<div class="wrap">
  <section class="sheet" aria-label="Progress, drawn as a planting plan">
    <div class="sheet-head">
      <span><b>Planting plan</b> · sheet L-1</span>
      <span id="sheet-note">0 of 9 plants placed</span>
    </div>
    <svg id="plan" viewBox="0 0 640 200" role="img" aria-label="A garden bed that fills with plants as you answer"></svg>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  </section>

  <main id="card" class="card" aria-live="polite"></main>

  <p class="foot">Answers save on this device as you go, so you can close the page and come back.</p>
</div>

<script>
// ---------- Survey content ----------
const STEPS = [
  {
    id: "work", eyebrow: "1 · Your work", title: "What does a typical job look like?",
    lede: "This tells us whose problems to solve first.",
    qs: [
      { id: "projects", type: "multi", label: "What kinds of projects do you take on?", options: ["Residential", "Commercial", "Municipal / parks", "Estates", "HOA / multifamily"], other: true },
      { id: "size", type: "single", label: "Typical site size", options: ["Front or back yard", "Whole lot, about ¼ acre", "Around an acre", "Multi-acre"] },
      { id: "role", type: "single", label: "Your role", options: ["Design only", "Design-build (I price and install)", "Mostly install, some design"], other: true },
    ],
  },
  {
    id: "deliver", eyebrow: "2 · Deliverables", title: "What do you hand people at the end?",
    qs: [
      { id: "toClient", type: "multi", label: "To the client", options: ["Printed color plan", "PDF", "3D images", "Walkthrough video", "Hand sketch", "Plant photo sheet"], other: true },
      { id: "toCrew", type: "multi", label: "To the crew or nursery", options: ["Plant list", "Dimensioned plan", "Bid / estimate", "Material quantities", "Nothing formal"], other: true },
    ],
  },
  {
    id: "tool", eyebrow: "3 · Your current software", title: "Tell us about the tool you use now.",
    lede: "This is the most useful page of the survey. Be blunt.",
    qs: [
      { id: "software", type: "multi", label: "Which software do you use?", options: ["PRO Landscape", "DynaSCAPE", "Vectorworks Landmark", "AutoCAD + Land F/X", "SketchUp", "Realtime Landscaping", "iScape", "Pen and paper"], other: true },
      { id: "years", type: "text", label: "How long have you used it?", placeholder: "e.g. about 6 years" },
      { id: "frustrations", type: "three", label: "The three moments that make you want to throw it out the window", placeholders: ["Drawing curvy bed lines takes forever…", "Second frustration", "Third frustration"] },
      { id: "keep", type: "text", label: "One thing it does that you'd hate to lose", placeholder: "e.g. the plant schedule is automatic" },
    ],
  },
  {
    id: "draw", eyebrow: "4 · How you draw", title: "How do you get from site to plan?",
    qs: [
      { id: "device", type: "multi", label: "What do you draw with?", options: ["Mouse", "Trackpad", "iPad + Pencil", "Wacom / pen tablet", "Paper first, then computer"] },
      { id: "start", type: "multi", label: "What do you start a base plan from?", options: ["Property survey", "Aerial / satellite photo", "My own tape measurements", "Architect's drawings", "Client's sketch"] },
      { id: "look", type: "scale", label: "What should client plans look like?", ends: ["Crisp CAD lines", "Hand-rendered, watercolor feel"] },
      { id: "units", type: "single", label: "Units", options: ["Feet and inches", "Metric", "Both"] },
      { id: "dwg", type: "single", label: "Do you swap DWG/DXF files with architects or engineers?", options: ["Never", "Sometimes", "All the time"] },
    ],
  },
  {
    id: "plants", eyebrow: "5 · Plants", title: "What does your plant palette look like?",
    qs: [
      { id: "region", type: "text", label: "Region and hardiness zone", placeholder: "e.g. Denver, zone 5b" },
      { id: "palette", type: "single", label: "How many plants are in your regular palette?", options: ["Under 50", "50–150", "150–400", "400+"] },
      { id: "plantInfo", type: "multi", label: "What do you look at when choosing a plant?", options: ["Mature size", "Sun / shade", "Water needs", "Hardiness zone", "Bloom color & season", "Fall color", "Evergreen vs deciduous", "Native", "Deer resistant", "Cost", "Nursery availability"], other: true },
      { id: "symbols", type: "single", label: "Do you have your own plant symbols you'd want to bring in?", options: ["Yes", "A few", "No"] },
    ],
  },
  {
    id: "site3d", eyebrow: "6 · 3D and the site", title: "How much do height and terrain matter?",
    qs: [
      { id: "freq3d", type: "scale", label: "How often do clients need to see it in 3D?", ends: ["Never", "Every job"] },
      { id: "quality3d", type: "single", label: "How good does 3D need to look?", options: ["Simple massing is fine", "Decent, with real-looking plants", "Close to photoreal"] },
      { id: "grading", type: "single", label: "Grading, slopes and drainage", options: ["Mostly flat sites", "Some slopes and steps", "Grading is a big part of my work"] },
      { id: "team", type: "single", label: "Who else touches your files?", options: ["Just me", "A small team", "Clients need to view them", "Team and clients"] },
    ],
  },
  {
    id: "wish", eyebrow: "7 · Wishlist", title: "Pick the five ideas you'd use most.",
    lede: "These came out of an early brainstorm. Pick what would change your week.",
    qs: [
      { id: "top5", type: "pick", max: 5, label: "Choose up to five", options: [
        ["Smooth curve tool", "Sketch a rough bed line and it snaps into a clean curve"],
        ["Live quantities", "Patio sq ft, mulch cu yd and edging ft update as you draw"],
        ["Plant library with real data", "Mature size, sun, zone, bloom; searchable and filterable"],
        ["Automatic plant schedule", "Legend with counts and sizes that never goes out of sync"],
        ["Real-scale paver patterns", "Herringbone, running bond, flagstone at true size, rotatable"],
        ["Reusable components", "Save a fire pit or planting combo, reuse it in any project"],
        ["Survey / aerial import", "Drop in a PDF or photo and set its scale with two clicks"],
        ["Fill and row tools", "Groundcover fill and hedge rows at exact spacing and count"],
        ["3D view", "Orbit around the design with extruded walls and plant shapes"],
        ["Growth slider", "See the design at install, year 5 and year 20"],
        ["Section cuts", "Draw a line across the plan and get an elevation along it"],
        ["Works on iPad", "Sketch and measure on site with a stylus"],
        ["Client share link", "Client views, comments and approves option A or B"],
        ["Sun and shade study", "Shadows by time of day and season"],
        ["Design options", "Duplicate into option A and B and compare side by side"],
        ["Print to scale", "Title block, north arrow, scale bar, PDF at 1/8\" = 1'"],
      ] },
    ],
  },
  {
    id: "money", eyebrow: "8 · Practical stuff", title: "Last few questions.",
    qs: [
      { id: "pay", type: "single", label: "If it solved your top frustrations, would you pay for it?", options: ["Yes", "Probably", "Not sure", "No"] },
      { id: "cost", type: "text", label: "What does your current software cost you?", placeholder: "e.g. $1,200 a year" },
      { id: "share", type: "single", label: "Could you share a recent project, or a short screen recording of you working?", options: ["Yes, happy to", "Maybe, ask me", "Probably not"] },
    ],
  },
  {
    id: "wand", eyebrow: "9 · Magic wand", title: "If you could wave a wand, what would this tool do?",
    qs: [
      { id: "wand", type: "long", label: "Anything at all, big or small", placeholder: "I'd love to be standing in the client's yard with an iPad and…" },
      { id: "name", type: "text", label: "Your name", placeholder: "So we know who to thank" },
    ],
  },
];

// ---------- Plan drawing: one plant per step ----------
const PLANTS = [
  { kind: "tree", x: 92, y: 96, r: 48, color: "leaf-a", tag: "AC RU" },
  { kind: "shrub", x: 186, y: 128, r: 24, color: "leaf-b", tag: "IL GL" },
  { kind: "grass", x: 240, y: 76, r: 20, color: "leaf-a", tag: "PA VI" },
  { kind: "shrub", x: 300, y: 132, r: 26, color: "bloom", tag: "HY PA" },
  { kind: "ground", x: 356, y: 84, r: 20, color: "leaf-b", tag: "SE SP" },
  { kind: "tree", x: 436, y: 104, r: 42, color: "leaf-b", tag: "CE CA" },
  { kind: "grass", x: 506, y: 142, r: 18, color: "leaf-a", tag: "CA KF" },
  { kind: "shrub", x: 532, y: 70, r: 22, color: "leaf-a", tag: "BU MI" },
  { kind: "ground", x: 588, y: 120, r: 18, color: "bloom", tag: "NE WA" },
];

const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

function scallopPath(cx, cy, r, bumps) {
  const pts = [];
  for (let k = 0; k <= bumps; k++) {
    const a = (k / bumps) * Math.PI * 2;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  const chord = 2 * r * Math.sin(Math.PI / bumps);
  const rb = (chord * 0.62).toFixed(2);
  let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for (let k = 1; k < pts.length; k++) d += ` A${rb},${rb} 0 0 1 ${pts[k][0].toFixed(2)},${pts[k][1].toFixed(2)}`;
  return d + "Z";
}

function drawPlant(p, parent, animate) {
  const g = el("g", { class: animate ? "plant" : "" }, parent);
  const fill = `var(--${p.color})`;
  const stroke = "var(--ink)";
  if (p.kind === "tree") {
    el("circle", { cx: p.x + 6, cy: p.y + 6, r: p.r, fill: "var(--line)", opacity: 0.55 }, g);
    el("circle", { cx: p.x, cy: p.y, r: p.r, fill, "fill-opacity": 0.55, stroke, "stroke-width": 1.2 }, g);
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2 + 0.3;
      const len = p.r * (0.62 + 0.2 * ((k * 7) % 3) / 2);
      el("line", { x1: p.x, y1: p.y, x2: p.x + len * Math.cos(a), y2: p.y + len * Math.sin(a), stroke, "stroke-width": 0.9, "stroke-linecap": "round", opacity: 0.7 }, g);
    }
    el("circle", { cx: p.x, cy: p.y, r: 2.5, fill: stroke }, g);
  } else if (p.kind === "shrub") {
    el("path", { d: scallopPath(p.x, p.y, p.r * 0.86, 9), fill, "fill-opacity": 0.75, stroke, "stroke-width": 1.1 }, g);
    el("circle", { cx: p.x, cy: p.y, r: 1.8, fill: stroke }, g);
  } else if (p.kind === "grass") {
    el("circle", { cx: p.x, cy: p.y, r: p.r * 0.8, fill, "fill-opacity": 0.35 }, g);
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * Math.PI * 2;
      const len = p.r * (k % 2 ? 0.7 : 1);
      el("line", { x1: p.x, y1: p.y, x2: p.x + len * Math.cos(a), y2: p.y + len * Math.sin(a), stroke, "stroke-width": 1, "stroke-linecap": "round" }, g);
    }
  } else {
    for (let ring = 0; ring < 3; ring++) {
      const n = [1, 6, 11][ring], rr = [0, 0.45, 0.85][ring] * p.r;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + ring;
        el("circle", { cx: p.x + rr * Math.cos(a), cy: p.y + rr * Math.sin(a), r: 3.2, fill, stroke, "stroke-width": 0.8 }, g);
      }
    }
  }
  // Hand-lettered callout with a short leader, like a planting plan key
  const lx = p.x + p.r * 0.7, ly = p.y - p.r * 0.75;
  el("line", { x1: p.x + p.r * 0.35, y1: p.y - p.r * 0.35, x2: lx + 6, y2: ly - 4, stroke: "var(--muted)", "stroke-width": 0.8 }, g);
  const t = el("text", { x: lx + 8, y: ly - 6, "font-family": "var(--font-hand)", "font-size": 11, fill: "var(--muted)" }, g);
  t.textContent = p.tag;
}

let drawnCount = -1;
function drawPlan(count) {
  const svg = document.getElementById("plan");
  if (drawnCount === -1) {
    svg.innerHTML = "";
    // Bed outline: a smooth, curvy bed line
    el("path", {
      d: "M24,150 C40,40 150,22 250,40 S420,20 520,34 S632,70 622,132 S520,186 400,176 S220,190 140,182 S30,196 24,150Z",
      fill: "var(--moss-soft)", stroke: "var(--ink)", "stroke-width": 1.4,
    }, svg);
    // Mulch stipple inside the bed
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 90; i++) {
      el("circle", { cx: 60 + rnd() * 540, cy: 50 + rnd() * 120, r: 0.9, fill: "var(--muted)", opacity: 0.45 }, svg);
    }
    el("g", { id: "plants" }, svg);
    // North arrow
    const na = el("g", { transform: "translate(612,24)" }, svg);
    el("circle", { cx: 0, cy: 0, r: 10, fill: "none", stroke: "var(--muted)", "stroke-width": 0.9 }, na);
    el("path", { d: "M0,-9 L4,4 L0,1 L-4,4Z", fill: "var(--ink)" }, na);
    const n = el("text", { x: -4, y: -13, "font-family": "var(--font-hand)", "font-size": 10, fill: "var(--muted)" }, na);
    n.textContent = "N";
    // Scale bar: 0, 5, 10 ft
    const sb = el("g", { transform: "translate(24,188)" }, svg);
    el("rect", { x: 0, y: 0, width: 30, height: 4, fill: "var(--ink)" }, sb);
    el("rect", { x: 30, y: 0, width: 30, height: 4, fill: "none", stroke: "var(--ink)", "stroke-width": 0.8 }, sb);
    [["0", 0], ["5", 30], ["10 ft", 60]].forEach(([s, x]) => {
      const tt = el("text", { x: x - 2, y: -3, "font-family": "var(--font-hand)", "font-size": 9, fill: "var(--muted)" }, sb);
      tt.textContent = s;
    });
    drawnCount = 0;
  }
  const g = document.getElementById("plants");
  if (count < drawnCount) { g.innerHTML = ""; drawnCount = 0; }
  for (let i = drawnCount; i < count; i++) drawPlant(PLANTS[i], g, true);
  drawnCount = count;
  document.getElementById("sheet-note").textContent =
    count === PLANTS.length ? "Plan complete. Thank you!" : `${count} of ${PLANTS.length} plants placed`;
  document.getElementById("bar").style.width = `${(count / PLANTS.length) * 100}%`;
}

// ---------- State ----------
const STORE_KEY = "designer-survey-v1";
let state = { step: -1, answers: {} };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && typeof saved === "object") state = Object.assign(state, saved);
} catch (e) {}
if (window.claude?.hot?.data?.state) state = window.claude.hot.data.state;
window.claude?.hot?.snapshot?.(() => ({ state }));

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
const A = (id) => state.answers[id];
const setA = (id, v) => { state.answers[id] = v; save(); };

// ---------- Rendering ----------
const card = document.getElementById("card");
const h = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else n.setAttribute(k, props[k]);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};

function chipGroup(q) {
  const multi = q.type === "multi";
  const cur = A(q.id) || (multi ? { picked: [], other: "" } : { picked: null, other: "" });
  const wrap = h("div", { class: "chips", role: "group" });
  const options = [...q.options, ...(q.other ? ["Other"] : [])];
  const otherInput = q.other ? h("input", {
    type: "text", id: `${q.id}-other`, placeholder: "Tell us more", value: cur.other || "",
    "aria-label": `${q.label}: other`,
    oninput: (e) => { cur.other = e.target.value; setA(q.id, cur); },
  }) : null;
  const isOn = (o) => multi ? cur.picked.includes(o) : cur.picked === o;
  const syncOther = () => { if (otherInput) otherInput.hidden = !isOn("Other"); };
  options.forEach((o) => {
    const b = h("button", { type: "button", class: "chip", "aria-pressed": String(isOn(o)) }, o);
    b.addEventListener("click", () => {
      if (multi) cur.picked = isOn(o) ? cur.picked.filter((x) => x !== o) : [...cur.picked, o];
      else cur.picked = isOn(o) ? null : o;
      setA(q.id, cur);
      wrap.querySelectorAll(".chip").forEach((c, i) => c.setAttribute("aria-pressed", String(isOn(options[i]))));
      syncOther();
      if (o === "Other" && isOn("Other")) otherInput.focus();
    });
    wrap.append(b);
  });
  syncOther();
  return [wrap, otherInput];
}

function renderQuestion(q) {
  if (q.type === "multi" || q.type === "single") {
    return h("fieldset", { class: "q" },
      h("legend", {}, q.label, q.type === "multi" ? h("span", { class: "hint" }, "  · pick any") : null),
      ...chipGroup(q));
  }
  if (q.type === "text" || q.type === "long") {
    const input = h(q.type === "long" ? "textarea" : "input", {
      id: q.id, placeholder: q.placeholder || "", ...(q.type === "text" ? { type: "text" } : {}),
      oninput: (e) => setA(q.id, e.target.value),
    });
    input.value = A(q.id) || "";
    return h("div", { class: "q" }, h("label", { class: "qlabel", for: q.id }, q.label), input);
  }
  if (q.type === "three") {
    const vals = A(q.id) || ["", "", ""];
    const inputs = q.placeholders.map((ph, i) => {
      const inp = h("input", {
        type: "text", id: `${q.id}-${i}`, placeholder: ph, "aria-label": `${q.label}, #${i + 1}`,
        oninput: (e) => { vals[i] = e.target.value; setA(q.id, vals); },
      });
      inp.value = vals[i] || "";
      return inp;
    });
    return h("fieldset", { class: "q" }, h("legend", {}, q.label), ...inputs);
  }
  if (q.type === "scale") {
    const wrap = h("div", { class: "scale", role: "group" });
    for (let v = 1; v <= 5; v++) {
      const b = h("button", { type: "button", class: "chip", "aria-pressed": String(A(q.id) === v), "aria-label": `${v} of 5` }, String(v));
      b.addEventListener("click", () => {
        setA(q.id, A(q.id) === v ? null : v);
        wrap.querySelectorAll(".chip").forEach((c, i) => c.setAttribute("aria-pressed", String(A(q.id) === i + 1)));
      });
      wrap.append(b);
    }
    return h("fieldset", { class: "q" }, h("legend", {}, q.label), wrap,
      h("div", { class: "scale-ends" }, h("span", {}, `1 · ${q.ends[0]}`), h("span", {}, `5 · ${q.ends[1]}`)));
  }
  if (q.type === "pick") {
    const picked = A(q.id) || [];
    const count = h("span", { class: "count" });
    const grid = h("div", { class: "picks" });
    const sync = () => {
      count.textContent = `${picked.length} of ${q.max} picked`;
      grid.querySelectorAll(".pick").forEach((b, i) => {
        const on = picked.includes(q.options[i][0]);
        b.setAttribute("aria-pressed", String(on));
        b.disabled = !on && picked.length >= q.max;
      });
    };
    q.options.forEach(([name, desc]) => {
      const b = h("button", { type: "button", class: "pick" }, h("b", {}, name), h("span", {}, desc));
      b.addEventListener("click", () => {
        const i = picked.indexOf(name);
        if (i >= 0) picked.splice(i, 1); else if (picked.length < q.max) picked.push(name);
        setA(q.id, picked);
        sync();
      });
      grid.append(b);
    });
    sync();
    return h("fieldset", { class: "q" }, h("legend", {}, q.label, "  ", count), grid);
  }
}

function go(step) {
  state.step = step;
  save();
  render();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function render() {
  card.innerHTML = "";
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  const s = state.step;
  drawPlan(Math.max(0, Math.min(s, STEPS.length)));

  if (s < 0) {
    card.append(
      h("div", { class: "head" },
        h("span", { class: "eyebrow" }, "Before we build anything"),
        h("h1", {}, "Help shape a landscape design tool that doesn't fight you."),
        h("p", { class: "lede" }, "We're starting a new design tool for landscape designers. Before writing any code we want to understand how you actually work, and what your current software gets wrong."),
        h("p", { class: "lede" }, "There are 9 short pages, about 8 minutes in all. Skip anything you like. Each page you finish adds a plant to the plan above.")),
      h("div", { class: "nav" },
        h("span", { class: "kbd" }, "Press Enter to continue"),
        h("button", { type: "button", class: "btn", id: "next", onclick: () => go(0) }, "Start the survey")));
    return;
  }

  if (s >= STEPS.length) { renderDone(); return; }

  const step = STEPS[s];
  card.append(
    h("div", { class: "head" },
      h("span", { class: "eyebrow" }, step.eyebrow),
      h("h2", {}, step.title),
      step.lede ? h("p", { class: "lede" }, step.lede) : null),
    ...step.qs.map(renderQuestion),
    h("div", { class: "nav" },
      h("button", { type: "button", class: "btn ghost", onclick: () => go(s - 1) }, "Back"),
      h("button", { type: "button", class: "btn", id: "next", onclick: () => go(s + 1) },
        s === STEPS.length - 1 ? "Finish" : "Next")));
}

function formatAnswer(q) {
  const v = A(q.id);
  if (v == null) return "";
  if (q.type === "multi" || q.type === "single") {
    const list = q.type === "multi" ? [...v.picked] : (v.picked ? [v.picked] : []);
    const i = list.indexOf("Other");
    if (i >= 0) list[i] = v.other ? `Other: ${v.other}` : "Other";
    return list.join(", ");
  }
  if (q.type === "three") return v.filter(Boolean).map((x, i) => `\n   ${i + 1}. ${x}`).join("");
  if (q.type === "scale") return `${v} of 5  (1 = ${q.ends[0]}, 5 = ${q.ends[1]})`;
  if (q.type === "pick") return v.map((x, i) => `\n   ${i + 1}. ${x}`).join("");
  return String(v).trim();
}

function buildSummary() {
  const name = (A("name") || "").trim();
  let out = `LANDSCAPE TOOL SURVEY${name ? ` · ${name}` : ""}\n`;
  for (const step of STEPS) {
    const lines = step.qs.filter((q) => q.id !== "name").map((q) => [q, formatAnswer(q)]).filter(([, a]) => a);
    if (!lines.length) continue;
    out += `\n## ${step.eyebrow.replace(/^\d+ · /, "")}\n`;
    for (const [q, a] of lines) out += `- ${q.label}: ${a}\n`;
  }
  return out.trim();
}

function renderDone() {
  const text = buildSummary();
  const pre = h("div", { class: "summary", id: "summary", tabindex: "0" }, text);
  const status = h("div", { class: "status", role: "status" });
  const copy = h("button", { type: "button", class: "btn", id: "next" }, "Copy my answers");
  copy.addEventListener("click", () => {
    const done = () => { status.textContent = "Copied. Now paste it into a text or email back to me."; };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      status.textContent = "Your answers are selected. Copy them with Ctrl+C (or ⌘C), then paste them back to me.";
    };
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (e) { fallback(); }
  });
  card.append(
    h("div", { class: "head" },
      h("span", { class: "eyebrow" }, "Done"),
      h("h2", {}, "Thanks. That's the whole plan."),
      h("p", { class: "lede" }, "One last step: copy your answers and send them back to me in a text or email. Nothing is sent automatically.")),
    pre,
    status,
    h("div", { class: "nav" },
      h("button", { type: "button", class: "btn ghost", onclick: () => go(STEPS.length - 1) }, "Back to edit"),
      copy));
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "TEXTAREA" || t.tagName === "BUTTON") return;
  if (state.step >= STEPS.length) return;
  e.preventDefault();
  document.getElementById("next")?.click();
});

render();
</script>
